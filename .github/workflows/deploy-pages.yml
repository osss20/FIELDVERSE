name: Check and deploy preview

# Runs `npm run check` on every push to main. The GitHub Pages deploy runs only
# when Pages is enabled for this repository (Settings → Pages → Source: GitHub
# Actions). While it is not enabled — e.g. a private repo on GitHub Free — the
# deploy is skipped instead of failing, so pushes stay green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one but never
# cancels a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.detect.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Detect GitHub Pages
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type > build_type.txt 2>/dev/null \
             && [ "$(cat build_type.txt)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages (source: GitHub Actions) is not enabled; running checks only, skipping deploy."
          fi

      - name: Configure Pages
        id: pages
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      # Typecheck, lint, tests and the production build. Any failure stops the
      # job, so a broken build is never deployed.
      - name: Check and build
        run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload site
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
